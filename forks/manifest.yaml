- name: fusion-harness
  fork_url: https://github.com/nantas/fusion-harness
  upstream_url: https://github.com/disler/fusion-harness
  upstream_source: git:github.com/disler/fusion-harness
  status: active
  last_upstream_sync: null
  changes_summary: 'v0.2.6: /thinking renamed to /fh-thinking (pi 0.84.3 added built-in /thinking that shadows same-named extension commands in autocomplete and dispatch, making the fusion role-thinking override unreachable and warning at every startup; renamed to match /fh-reset, no logic changes); v0.2.5: contentless panels send empty array instead of empty string (fix Zhipu 1210 — pi convertToLlm turns empty-string content into an empty-text-block role:user message that OpenAI-compatible backends reject when the request carries tool-call history; empty array is skipped by every pi protocol serializer, preserving v0.2.4 zero-context-leak with no display loss); v0.2.4: boot banner content emptied (fix LLM context leak — "FUSION HARNESS" decorative string was injected as a role:user message every TUI startup via pi convertToLlm, though the boot renderer never read content; zero display loss); v0.2.3: output confinement (scratch-only, no canonical pollution) — workerPrompt() gains artifactsDir param; WORKER prompt reworked (OUTPUT BOUNDARY + partition-dir + PATH-REWRITE + SLUG PURITY, drops legacy identity-in-path + fuser-publishes-canonical hint that caused slug pollution); MERGE prompt adds matching OUTPUT BOUNDARY + Publish Manifest item; v0.2.2: status bar BUILDER cell shows configured builder model when host differs (display-only, execution always used --model); v0.2.1: fusionSettings global fallback (fix architect/builder defaulting to upstream in other repos); v0.2.0: /fusion --merge-existing (skip Stage1 reuse answers) + fusion_merge agent tool (natural-language merge) + child extension injection (-e fusionHarness.childExtensions, fixes grok-build provider in --no-extensions children); resolveMergeDir short-id fallback; v0.1.8: archive injects agent+tools (question UX); v0.1.7: agent-driven archive inventory+apply (no fused.md HV); v0.1.6: archive folder+slug; v0.1.5: status shows prompt topic; v0.1.4: /fusion-housekeep status|archive|clean + run-index.jsonl dual-write/reconcile; v0.1.1: package.json pi.extensions; v0.1.0: ARTIFACT_ROOT .scratch/fusion-harness/, sub-agent skills/context, FUSION output lock, fusionHarness settings fallback.'
