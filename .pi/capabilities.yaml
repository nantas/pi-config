# Pi-Config Capability Manifest
# Single source of truth for which .pi/ resources are globally synced
# and which are available for on-demand installation by other repositories.

global:
  # AGENTS.md is always synced to ~/.pi/agent/
  agent_md: true

  # mcp.json is synced to ~/.pi/agent/mcp.json
  mcp_config: true

  # Extensions synced to ~/.pi/agent/extensions/ (single-file .ts)
  extensions:
    - dollar-skill-invoke
    - planner-toggle
    - output-scroll-viewer
    - tool-counter-widget
    - init-command
    - browse-session-tree
    - session-browse

  # Agents synced to ~/.pi/agent/agents/
  agents:
    - unity-worker

  # Skills synced to ~/.pi/agent/skills/
  skills:
    - install-from-pi-config

  # Prompts synced to ~/.pi/agent/prompts/
  prompts:
    - opsx-apply
    - opsx-archive
    - opsx-bulk-archive
    - opsx-continue
    - opsx-explore
    - opsx-ff
    - opsx-new
    - opsx-propose
    - opsx-sync
    - opsx-verify

  # Settings generated directly into ~/.pi/agent/settings.json
  # Keys listed here are authoritative — keys NOT listed are preserved from target.
  settings:
    packages:
      - npm:@eko24ive/pi-ask
      - npm:@tmustier/pi-tab-status
      - npm:pi-subagents@0.24.0
      - git:github.com/jwu/pi-powerline
      - git:github.com/lucasmeijer/pi-terminal-signals
      - git:github.com/nantas/pi-tool-display
      - git:github.com/nantas/pi-mcp-adapter
    defaultThinkingLevel: high
    defaultProvider: deepseek
    defaultModel: deepseek-v4-flash
    subagents:
      agentOverrides:
        context-builder:
          model: deepseek/deepseek-v4-flash
          thinking: high
          tools:
            - read
            - grep
            - find
            - ls
            - bash
            - write
            - web_search
            - intercom
            - gitnexus_query
            - gitnexus_context
            - gitnexus_impact
        oracle:
          model: deepseek/deepseek-v4-flash
          thinking: medium
        planner:
          model: deepseek/deepseek-v4-flash
          thinking: high
        researcher:
          model: zhipuai-coding-plan/glm-5.1
          thinking: high
          tools:
            - read
            - write
            - web_search
            - fetch_content
            - get_search_content
            - intercom
            - gitnexus_query
        reviewer:
          model: zhipuai-coding-plan/glm-5.1
          thinking: high
        scout:
          model: zhipuai-coding-plan/glm-4.5-air
          thinking: minimal
          tools:
            - read
            - grep
            - find
            - ls
            - bash
            - write
            - intercom
            - gitnexus_query
            - gitnexus_context
            - gitnexus_impact
            - gitnexus_list_repos
        worker:
          model: zhipuai-coding-plan/glm-5.1
          thinking: low
          tools:
            - read
            - grep
            - find
            - ls
            - bash
            - edit
            - write
            - contact_supervisor
            - gitnexus_query
            - gitnexus_context

catalog:
  # Skills available for on-demand installation by other repositories
  skills:
    - name: obsidian-search
      source: obsidian-search
      description: "Intelligent Obsidian vault retrieval via obsidian_search and obsidian_cli tools"
      requires:
        extensions:
          - obsidian-tools
    - name: pi-extension-dev
      source: pi-extension-dev
      description: "Guide the LLM through the complete lifecycle of developing a Pi extension"
    - name: pkg-fork-dev
      source: pkg-fork-dev
      description: "Guide the LLM through forking and modifying existing third-party Pi packages"
    - name: pkg-research
      source: pkg-research
      description: "Structured workflow for researching, evaluating, and managing third-party Pi packages"

  # Extensions available for on-demand installation
  extensions:
    - name: add-provider
      source: add-provider
      description: "Add custom model providers to Pi agent configuration"
    - name: obsidian-tools
      source: obsidian-tools
      description: "Obsidian integration tools for Pi agent"
      has_package_json: true
    - name: trellis-analytics
      source: trellis-analytics
      description: "Passive telemetry for Trellis workflow observability, context consumption tracking, and streaming JSONL persistence"

  # Packages available for on-demand installation (settings-entry type)
  packages:
    - name: lsp-pi
      source: npm:lsp-pi
      description: "LSP integration for Pi coding agent"
      type: settings-entry
