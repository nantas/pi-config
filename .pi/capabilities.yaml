# Pi-Config Capability Manifest
# Single source of truth for which .pi/ resources are globally synced
# and which are available for on-demand installation by other repositories.

global:
  # AGENTS.md is always synced to ~/.pi/agent/
  agent_md: true

  # mcp.json is synced to ~/.pi/agent/mcp.json
  mcp_config: true

  # Extensions synced to ~/.pi/agent/extensions/ (single-file .ts)
  extensions:
    - dollar-skill-invoke
    - tool-counter-widget
    - init-command
    - browse-session-tree

  # Agents synced to ~/.pi/agent/agents/
  agents:
    - unity-worker
    - scout
    - worker
    - context-builder
    - oracle
    - planner
    - researcher
    - reviewer

  # Skills synced to ~/.pi/agent/skills/
  skills:
    - install-from-pi-config
    - notion
    - agent-reach

  # Prompts synced to ~/.pi/agent/prompts/
  prompts:
    - opsx-apply
    - opsx-archive
    - opsx-bulk-archive
    - opsx-continue
    - opsx-explore
    - opsx-ff
    - opsx-new
    - opsx-propose
    - opsx-sync
    - opsx-verify

  # Settings generated directly into ~/.pi/agent/settings.json
  # Keys listed here are authoritative — keys NOT listed are preserved from target.
  settings:
    packages:
      - npm:@tmustier/pi-tab-status
      - npm:@johnnywu/pi-subagents
      - git:github.com/jwu/pi-powerline
      - git:github.com/lucasmeijer/pi-terminal-signals
      - git:github.com/nantas/pi-tool-display
      - npm:pi-mcp-adapter
      - git:github.com/rwese/pi-question
      - git:github.com/jwu/pi-webfetch
      - npm:@ff-labs/pi-fff
      - git:github.com/DietrichGebert/ponytail
      - git:github.com/nantas/pi-xai
      - npm:pi-codex-image-gen
      - git:github.com/nantas/fusion-harness
    fusionHarness:
      architect: kimi-coding/k3
      builder: grok-build/grok-4.5
      architectThinking: high
      builderThinking: high
      childExtensions:
        - pi-xai
    defaultThinkingLevel: high
    defaultProvider: deepseek
    defaultModel: deepseek-v4-flash

  # Environment variables declared per-capability (global scope)
  # Each key is a capability ID matching an entry in packages/extensions/skills/agents
  env:
    pi-fff:
      description: "fff fuzzy file finder — frecency & history database paths; editor mode override"
      variables:
        FFF_FRECENCY_DB:
          value: "$HOME/.cache/pi/fff_frecency"
          description: "Path to LMDB frecency database for persistent ranking"
          required: true
        FFF_HISTORY_DB:
          value: "$HOME/.cache/pi/fff_history"
          description: "Path to LMDB history database for query persistence"
          required: true
        PI_FFF_MODE:
          value: tools-only
          description: "Disable FffEditor (@-mention autocomplete) to avoid setEditorComponent conflict with pi-powerline"
          required: true

catalog:
  # Skills available for on-demand installation by other repositories
  skills:
    - name: obsidian-search
      source: obsidian-search
      description: "Intelligent Obsidian vault retrieval via obsidian_search and obsidian_cli tools"
      requires:
        extensions:
          - obsidian-tools
    - name: pi-extension-dev
      source: pi-extension-dev
      description: "Guide the LLM through the complete lifecycle of developing a Pi extension"
    - name: pkg-fork-dev
      source: pkg-fork-dev
      description: "Guide the LLM through forking and modifying existing third-party Pi packages"
    - name: pkg-research
      source: pkg-research
      description: "Structured workflow for researching, evaluating, and managing third-party Pi packages"

  # Extensions available for on-demand installation
  extensions:
    - name: add-provider
      source: add-provider
      description: "Add custom model providers to Pi agent configuration"
    - name: obsidian-tools
      source: obsidian-tools
      description: "Obsidian integration tools for Pi agent"
      has_package_json: true
    - name: wikilink-batch-replace
      source: wikilink-batch-replace
      description: "Batch-replace bare text references with Obsidian wikilinks, auto-escaping pipe separators in table rows"

  # Packages available for on-demand installation (settings-entry type)
  packages: []

  # Environment variables for catalog capabilities (reserved)
  # Checked by install-from-pi-config during installation, not by global sync.
  # env:
  #   example-capability:
  #     description: "..."
  #     variables:
  #       EXAMPLE_VAR:
  #         value: "..."
  #         description: "..."
  #         required: false
