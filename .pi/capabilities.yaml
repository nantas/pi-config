# Pi-Config Capability Manifest
# Single source of truth for which .pi/ resources are globally synced
# and which are available for on-demand installation by other repositories.

global:
  # AGENTS.md is always synced to ~/.pi/agent/
  agent_md: true

  # Extensions synced to ~/.pi/agent/extensions/ (single-file .ts, or a directory
  # containing package.json with "pi": { "extensions": [...] })
  extensions:
    - dollar-skill-invoke
    - tool-counter-widget
    - init-command
    - bash-search-guard
    - hc-delegation

  # Extensions managed by external tools — sync ignores them entirely:
  # never copied from the repo, never overwritten, never removed during
  # stale cleanup. Entries are bare names matching <name>.ts or <name>/
  # in the target extensions dir (or exact filenames).
  external_extensions:
    - magpie

  # Agents synced to ~/.pi/agent/agents/
  agents:
    - worker
    - researcher
    - reviewer

  # Skills synced to ~/.pi/agent/skills/
  skills:
    - install-from-pi-config
    - notion
    - x-reach
    - worktrunk-isolation

  # Skills synced to ~/.agents/skills/ (cross-harness shared layer).
  # Additive-only: declared skills are wholesale-replaced at the target;
  # the sync script never removes undeclared content in this shared dir.
  # A skill must not appear in both `skills` and `shared_skills`.
  shared_skills:
    - agent-reach

  # hc (herdr-core) terminal templates synced to
  # ~/.config/herdr-core/templates/.
  # Additive-only: declared templates are replaced at the target; undeclared
  # templates on the target machine are never removed.
  hc_templates:
    - peer
    - grunt
    - workhorse

  # Prompts synced to ~/.pi/agent/prompts/
  prompts:
    - opsx-apply
    - opsx-archive
    - opsx-bulk-archive
    - opsx-continue
    - opsx-explore
    - opsx-ff
    - opsx-new
    - opsx-propose
    - opsx-sync
    - opsx-verify

  # Settings generated directly into ~/.pi/agent/settings.json
  # Keys listed here are authoritative — keys NOT listed are preserved from target.
  # Managed config files: target filename -> repo-relative source under .pi/
  # Manifest-declared files are authoritative (wholesale replace on sync).
  files: {}
  settings:
    # Purge adapter-era "-builtin:mcp" from target on every sync (pi-mcp-adapter
    # uninstall does not restore it; empty list = built-in MCP enabled).
    extensions: []
    packages:
      - npm:@johnnywu/pi-subagents
      - git:github.com/jwu/pi-powerline
      - git:github.com/nantas/pi-tool-display
      - git:github.com/jwu/pi-ask
      - git:github.com/jwu/pi-webfetch
      - npm:@ff-labs/pi-fff
    defaultThinkingLevel: high

  # Environment variables declared per-capability (global scope)
  # Each key is a capability ID matching an entry in packages/extensions/skills/agents
  env:
    pi-fff:
      description: "fff fuzzy file finder — frecency & history database paths; editor mode override"
      variables:
        FFF_FRECENCY_DB:
          value: "$HOME/.cache/pi/fff_frecency"
          description: "Path to LMDB frecency database for persistent ranking"
          required: true
        FFF_HISTORY_DB:
          value: "$HOME/.cache/pi/fff_history"
          description: "Path to LMDB history database for query persistence"
          required: true
        PI_FFF_MODE:
          value: override
          description: "Override built-in grep/find so fff engine is the sole search path (root-cause fix for grep/ffgrep tool competition). Safe since pi-fff v0.10+: migrated to addAutocompleteProvider, no longer touches setEditorComponent — coexists with pi-powerline editor."
          required: true

catalog:
  # Skills available for on-demand installation by other repositories
  skills:
    - name: obsidian-search
      source: obsidian-search
      description: "Intelligent Obsidian vault retrieval via obsidian_search and obsidian_cli tools"
      requires:
        extensions:
          - obsidian-tools
    - name: pi-extension-dev
      source: pi-extension-dev
      description: "Guide the LLM through the complete lifecycle of developing a Pi extension"
    - name: pkg-fork-dev
      source: pkg-fork-dev
      description: "Guide the LLM through forking and modifying existing third-party Pi packages"
    - name: pkg-research
      source: pkg-research
      description: "Structured workflow for researching, evaluating, and managing third-party Pi packages"

  # Extensions available for on-demand installation
  extensions:
    - name: obsidian-tools
      source: obsidian-tools
      description: "Obsidian integration tools for Pi agent"
      has_package_json: true
    - name: wikilink-batch-replace
      source: wikilink-batch-replace
      description: "Batch-replace bare text references with Obsidian wikilinks, auto-escaping pipe separators in table rows"

  # Packages available for on-demand installation (settings-entry type)
  packages: []

  # Environment variables for catalog capabilities (reserved)
  # Checked by install-from-pi-config during installation, not by global sync.
  # env:
  #   example-capability:
  #     description: "..."
  #     variables:
  #       EXAMPLE_VAR:
  #         value: "..."
  #         description: "..."
  #         required: false
